# Local stack: app, queue worker, scheduler and Postgres.
# Start with: docker compose up --build

x-app: &app
    build: .
    volumes:
        - .:/var/www/html
    environment: &app-env
        DB_CONNECTION: pgsql
        DB_HOST: postgres
        DB_PORT: 5432
        DB_DATABASE: pixelforge
        DB_USERNAME: pixelforge
        DB_PASSWORD: pixelforge
    depends_on:
        postgres:
            condition: service_healthy

services:
    app:
        <<: *app
        command: >
            sh -c "composer install --no-interaction
            && (test -f .env || cp .env.example .env)
            && php artisan key:generate --no-interaction
            && php artisan migrate --force
            && npm install && npm run build
            && php -S 0.0.0.0:8000 -t public public/index.php"
        ports:
            - '8000:8000'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'php -r ''exit(@fsockopen("127.0.0.1", 8000) ? 0 : 1);''',
                ]
            interval: 5s
            retries: 60

    queue:
        <<: *app
        command: php artisan queue:work --tries=3 --verbose
        depends_on:
            app:
                condition: service_healthy

    scheduler:
        <<: *app
        command: php artisan schedule:work
        depends_on:
            app:
                condition: service_healthy

    postgres:
        image: postgres:17
        environment:
            POSTGRES_DB: pixelforge
            POSTGRES_USER: pixelforge
            POSTGRES_PASSWORD: pixelforge
        volumes:
            - postgres:/var/lib/postgresql/data
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U pixelforge']
            interval: 3s
            retries: 20

volumes:
    postgres:
