# Production stack for the DigitalOcean droplet. See docs/deploy.md.
# Reads secrets from ./.env on the droplet (never committed). The image is
# built and pushed to GHCR by the deploy workflow; deploy.sh records
# the deployed tag as IMAGE_TAG in .env.
#
# The shared Caddy in /opt/stacks/caddy terminates TLS and reaches the app as
# `pixelforge-app:8080` over the external `proxy` network.
name: pixelforge

x-app: &app
    image: ghcr.io/ablunier/pixelforge-assessment:${IMAGE_TAG:?set IMAGE_TAG (deploy.sh does)}
    env_file: .env
    environment:
        APP_ENV: production
        APP_DEBUG: 'false'
        DB_CONNECTION: pgsql
        DB_HOST: pgsql
        DB_PORT: 5432
    volumes:
        - app-storage:/app/storage
    networks:
        - internal
    restart: unless-stopped
    depends_on:
        pgsql:
            condition: service_healthy

services:
    app:
        <<: *app
        networks:
            internal:
            proxy:
                aliases:
                    - pixelforge-app

    queue:
        <<: *app
        command: php artisan queue:work --tries=3 --max-time=3600 --sleep=1
        stop_grace_period: 60s
        healthcheck:
            disable: true

    scheduler:
        <<: *app
        command: php artisan schedule:work
        healthcheck:
            disable: true

    pgsql:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE in .env}
            POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
        volumes:
            - pgsql-data:/var/lib/postgresql
        networks:
            - internal
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -q -d "$$POSTGRES_DB" -U "$$POSTGRES_USER"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

networks:
    internal:
    proxy:
        external: true

volumes:
    pgsql-data:
    app-storage:
